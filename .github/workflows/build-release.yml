name: Build, verify and release Windows packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.114'
      - name: Choose release version
        shell: pwsh
        run: |
          $version = '1.0.0'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME -replace '^v',''
            if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Tags must use vMAJOR.MINOR.PATCH.' }
          }
          "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Build, run adversarial checks and package
        shell: pwsh
        run: ./scripts/Build-Release.ps1 -Version $env:PACKAGE_VERSION
      - name: Verify standalone self-extraction
        shell: pwsh
        run: ./scripts/Test-Standalone.ps1
      - name: Verify installation, language upgrade and uninstall
        shell: pwsh
        run: ./scripts/Test-Installer.ps1
      - name: Upload distributables
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 2Password-windows-x64
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-reports
          path: |
            artifacts/test-results.json
            artifacts/standalone-results.json
            artifacts/recovery-results.json
            artifacts/installer-results.json
            artifacts/localization-results.json
            artifacts/multiselect-results.json
            artifacts/install-smoke/**/*.log
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download verified packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: 2Password-windows-x64
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
            gh release edit "$RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
          else
            gh release create "$RELEASE_TAG" release/* --verify-tag --title "2Password $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
          fi
